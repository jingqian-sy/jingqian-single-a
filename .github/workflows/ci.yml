name: CI

# 不联网、不需要任何密钥：mock provider 在本地起一个假模型，
# 跑语法检查 + 判定器单测 + 工具/红线单测 + 服务冒烟 + 评测子集。
# 和本地 `node evals/ci.js` 同一套东西，挂在 Windows 上跑（这版工具/路径是照 Windows 写的）。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: evals/ci.js
    runs-on: windows-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 环境信息
        run: |
          node --version
          npm --version

      - name: 一条命令跑完（语法 / 单测 / mock / 冒烟 / 评测子集）
        run: node evals/ci.js

      - name: 失败时留现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure
          path: |
            data/ci-run/
            evals/.run/
          if-no-files-found: ignore
          retention-days: 7
