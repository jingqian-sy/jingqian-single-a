<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鲸倩 · 单A 雏版</title>
<style>
  :root { --bg:#f6f4ee; --ink:#232323; --dim:#8a8578; --line:#e3dfd3; --accent:#2f6f6a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; font-weight:600; letter-spacing:.5px; }
  header .meta { color:var(--dim); font-size:12px; }
  main { max-width:820px; margin:0 auto; padding:18px 16px 120px; }
  .msg { margin:14px 0; display:flex; gap:10px; }
  .msg .who { flex:0 0 44px; color:var(--dim); font-size:12px; padding-top:4px; }
  .msg .body { white-space:pre-wrap; word-break:break-word; }
  .msg.me .body { color:var(--accent); }
  .stats { color:var(--dim); font-size:12px; margin-top:6px; }
  form { position:fixed; left:0; right:0; bottom:0; background:linear-gradient(#f6f4ee00,#f6f4ee 30%); padding:14px 16px 20px; }
  .row { max-width:820px; margin:0 auto; display:flex; gap:8px; }
  input[type=text] { flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:15px; }
  button { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { max-width:820px; margin:6px auto 0; color:var(--dim); font-size:12px; }
  .err { color:#a33; }
.settingLink { margin-left:10px; font-size:13px; color:#2f6f6a; border:1px solid #cfe3dd; border-radius:6px; padding:2px 8px; text-decoration:none; }
.modelBox { margin-left:auto; display:flex; align-items:center; gap:8px; }
.modelBox select { font:13px/1.4 inherit; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); max-width:220px; }
.costBadge { font-size:12px; color:#2f6f6a; border:1px solid #cfe3dd; background:#fff; border-radius:8px; padding:4px 10px; cursor:pointer; white-space:nowrap; }
.costBadge b { font-weight:600; }
.costPanel { position:fixed; right:16px; top:64px; width:300px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 24px #00000014; padding:12px 14px; font-size:13px; z-index:20; }
.costPanel h3 { margin:0 0 8px; font-size:13px; font-weight:600; }
.costPanel .row2 { display:flex; justify-content:space-between; gap:8px; padding:3px 0; color:#555; }
.costPanel .row2 b { font-weight:600; color:var(--ink); }
.costPanel .tot { border-top:1px solid var(--line); margin-top:8px; padding-top:8px; font-weight:600; }
.costPanel .note { color:var(--dim); font-size:11px; line-height:1.5; margin-top:8px; }
.costPanel .acts { display:flex; gap:8px; margin-top:10px; }
.costPanel .acts button { flex:1; padding:7px 10px; font-size:12px; border-radius:8px; }
.costPanel .acts button.ghost { background:#fff; color:var(--accent); border:1px solid #cfe3dd; }
.costPanel .acts button.danger { background:#fff; color:#a33; border:1px solid #e6c3c3; }
</style>
</head>
<body>
<header>
  <h1>鲸倩 · 单A 雏版</h1>
  <a href="/console.html" class="settingLink">⚙ 设置</a>
  <div class="modelBox">
    <select id="modelSel" title="用哪个模型：点一下立刻生效，不用重启"></select>
    <span class="costBadge" id="costBadge" title="点开看今日账单">今日 ¥0.000</span>
  </div>
  <span class="meta" id="meta">正在自检…</span>
</header>

<div class="costPanel" id="costPanel" hidden>
  <h3>今日账单</h3>
  <div id="costBody"></div>
  <div class="acts">
    <button type="button" class="ghost" id="costClose">收起</button>
    <button type="button" class="danger" id="costReset">重置</button>
  </div>
</div>

<main id="log">
  <div class="msg greet">
    <div class="who">她</div>
    <div class="body">在呢。这儿是本地的雏版：会记事、能读写 data/workspace、动手之前看红线。
试试让我记点事，再问我还记不记得。</div>
  </div>
</main>

<form id="f">
  <div class="row">
    <input type="text" id="q" placeholder="说点什么…" autocomplete="off" autofocus>
    <button type="button" id="mic" title="按住说话（浏览器语音识别，中文）">🎙️</button>
    <button type="button" id="openSettings" title="设置：填模型、密钥、沙盒、白名单">⚙ 设置</button>
    <button id="send">发送</button>
  </div>
  <div class="hint" id="hint">默认只听 127.0.0.1；这版没有登录，别直接暴露到公网。
    <label style="margin-left:8px"><input type="checkbox" id="speakOn" checked> 念出来</label>
  </div>
</form>

<script>
const log = document.getElementById('log');
const meta = document.getElementById('meta');
const form = document.getElementById('f');
const input = document.getElementById('q');
const send = document.getElementById('send');
let session = 'web';
try {
  const saved = localStorage.getItem('jq-session');
  if (saved) session = saved;
  localStorage.setItem('jq-session', session);
} catch (e) { }

function add(who, text, cls) {
  const d = document.createElement('div');
  d.className = 'msg' + (cls ? ' ' + cls : '');
  const w = document.createElement('div');
  w.className = 'who';
  w.textContent = who;
  const b = document.createElement('div');
  b.className = 'body';
  b.textContent = text;
  d.appendChild(w); d.appendChild(b);
  log.appendChild(d);
  d.scrollIntoView({ block: 'end' });
  return d;
}

async function loadHistory() {
  try {
    const r = await fetch('/api/history?session=' + encodeURIComponent(session));
    const j = await r.json();
    if (!j.ok || !j.items || !j.items.length) return;
    const first = log.querySelector('.greet');
    if (first) first.remove();
    for (const m of j.items) add(m.role === 'user' ? '你' : '她', m.content, m.role === 'user' ? 'me' : '');
  } catch (e) { }
}
loadHistory();

async function selfcheck() {
  try {
    const r = await fetch('/api/selfcheck');
    const j = await r.json();
    const ready = j.providers.filter(p => p.ready).map(p => p.name + '/' + p.model);
    meta.textContent = '记忆 ' + j.memory.count + ' 条 · 事件 ' + j.memory.events
      + ' 件 · 沙盒 ' + j.sandbox.effective
      + ' · 模型 ' + (ready.length ? ready.join('、') : '没配');
    if (!ready.length) {
      add('她', '提醒一句：还没配模型。config.json 里填一家云端 key，或者本机起 Ollama（ollama pull qwen3:8b）。', 'err');
    }
  } catch (e) {
    meta.textContent = '自检失败：' + e.message;
  }
}
selfcheck();

// ---------- 模型切换（点一下立刻生效，不重启） ----------
const modelSel = document.getElementById('modelSel');
let routeState = null;
let pinnedName = '';

function describeMode(s) {
  const r = (s && s.route) || {};
  const first = (r.order || [])[0];
  if (r.mode === 'fixed' && first) return '固定：' + first;
  if (r.mode === 'cloud-first') return '自动：先云端';
  return '自动：先免费';
}

async function loadRoute() {
  try {
    const r = await fetch('/api/route');
    const j = await r.json();
    if (!j.ok) return;
    routeState = j;
    const mode = (j.route && j.route.mode) || 'cheap-first';
    const order = (j.route && j.route.order) || [];
    pinnedName = mode === 'fixed' && order[0] ? order[0] : '';
    const opts = [
      { v: 'mode:cheap-first', t: '自动：先免费/本地' },
      { v: 'mode:cloud-first', t: '自动：先云端' }
    ].concat((j.providers || []).map((p) => ({
      v: 'pin:' + p.name,
      t: (pinnedName === p.name ? '✓ ' : '') + p.name + '（' + (p.model || '?') + '）'
        + (p.free ? ' 免费' : '') + (p.ready ? '' : ' 未配置'),
      ready: p.ready
    })));
    modelSel.innerHTML = '';
    for (const o of opts) {
      const el = document.createElement('option');
      el.value = o.v;
      el.textContent = o.t;
      if (o.v.indexOf('pin:') === 0 && !o.ready) el.disabled = true;
      if ((o.v.indexOf('pin:') === 0 && pinnedName && o.v === 'pin:' + pinnedName) || (!pinnedName && o.v === 'mode:' + mode)) el.selected = true;
      modelSel.appendChild(el);
    }
    modelSel.title = '当前：' + describeMode(j) + (j.last && j.last.provider ? '（上次走 ' + j.last.provider + '）' : '');
  } catch (e) { }
}

modelSel.onchange = async () => {
  const v = modelSel.value || '';
  const body = v.indexOf('pin:') === 0 ? { pin: v.slice(4) } : { mode: v.slice(5) };
  modelSel.disabled = true;
  try {
    const r = await fetch('/api/route', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body)
    });
    const j = await r.json();
    if (!j.ok) add('她', '切换没成：' + j.error, 'err');
    else add('她', '模型切好了：' + describeMode(j) + '。这一轮之后就走它。', '');
  } catch (e) {
    add('她', '切换失败：' + e.message, 'err');
  } finally {
    modelSel.disabled = false;
    await loadRoute();
    await loadCost();
  }
};

// ---------- 账单：今日金额常驻 + 明细面板 + 重置 ----------
const costBadge = document.getElementById('costBadge');
const costPanel = document.getElementById('costPanel');
const costBody = document.getElementById('costBody');
const money = (n) => '¥' + (Number(n) || 0).toFixed(3);

async function loadCost() {
  try {
    const r = await fetch('/api/cost?days=7');
    const j = await r.json();
    if (!j || j.ok === false) return;
    costBadge.innerHTML = '今日 <b>' + money(j.today && j.today.cost) + '</b>';
    const rows = [];
    const ps = (j.today && j.today.providers) || [];
    if (!ps.length) rows.push('<div class="row2"><span>今天还没调用</span><b>—</b></div>');
    for (const p of ps) {
      rows.push('<div class="row2"><span>' + p.name + ' · ' + p.calls + ' 次</span><b>' + money(p.cost) + '</b></div>');
    }
    rows.push('<div class="row2 tot"><span>今日合计</span><b>' + money(j.today && j.today.cost) + '</b></div>');
    rows.push('<div class="row2"><span>近 7 天合计</span><b>' + money(j.total) + '</b></div>');
    if (j.reset) rows.push('<div class="note">上次重置：' + String(j.reset.at).slice(0, 16).replace('T', ' ') + '（只从那时起累计，原账本还在）</div>');
    rows.push('<div class="note">' + (j.note || '') + '</div>');
    costBody.innerHTML = rows.join('');
  } catch (e) { }
}

costBadge.onclick = async () => {
  costPanel.hidden = !costPanel.hidden;
  if (!costPanel.hidden) await loadCost();
};
document.getElementById('costClose').onclick = () => { costPanel.hidden = true; };
document.getElementById('costReset').onclick = async () => {
  if (!confirm('把今日已显示的金额归零？原始账本不会删，只是从现在重新算。')) return;
  try {
    const r = await fetch('/api/cost/reset', { method: 'POST' });
    const j = await r.json();
    if (j.ok) await loadCost();
    else alert('重置失败：' + j.error);
  } catch (e) { alert('重置失败：' + e.message); }
};

loadRoute();
loadCost();

// ---------- 通话模式：一直听着 / 能打断 / 有垫音 ----------
const micBtn = document.getElementById('mic');
const speakOn = document.getElementById('speakOn');
const hint = document.getElementById('hint');
let recog = null;
let inCall = false;
let phase = 'idle';        // idle | listening | thinking | speaking
let pendingText = '';
let flushTimer = null;
let currentReply = '';     // 正在念的回复，用来挡回声
let fillerTimer = null;
let fillerUtt = null;

function pickVoice() {
  if (!window.speechSynthesis) return null;
  const vs = speechSynthesis.getVoices() || [];
  return vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /zh/i.test(v.lang)) || null;
}

function setStatus(t) { hint.textContent = t; }

function norm(t) { return String(t || '').replace(/[\s，。！？、,.!?~…—\-]/g, ''); }

// 是不是麦克风把她自己的声音听回来了
function looksLikeEcho(heard) {
  const h = norm(heard);
  if (!h) return true;
  if (h.length < 4) return true;
  const r = norm(currentReply);
  if (!r) return false;
  if (r.includes(h)) return true;
  // 简单相似度：连续 8 个字出现在回复里就当成回声
  for (let i = 0; i + 8 <= h.length; i++) {
    if (r.includes(h.slice(i, i + 8))) return true;
  }
  return false;
}

function utter(text, opts) {
  const u = new SpeechSynthesisUtterance(String(text).replace(/[*#`]/g, '').slice(0, 400));
  const v = pickVoice();
  if (v) u.voice = v;
  u.lang = 'zh-CN';
  u.rate = (opts && opts.rate) || 1.05;
  u.pitch = 1.0;
  return u;
}

function speakReply(text, onDone) {
  if (!window.speechSynthesis || !speakOn.checked) { if (onDone) setTimeout(onDone, 100); return; }
  try {
    speechSynthesis.cancel();
    currentReply = String(text || '');
    const u = utter(currentReply);
    u.onend = () => { currentReply = ''; if (onDone) onDone(); };
    u.onerror = () => { currentReply = ''; if (onDone) onDone(); };
    speechSynthesis.speak(u);
  } catch (e) { currentReply = ''; if (onDone) setTimeout(onDone, 100); }
}

// 垫音：等回复超过 600ms 还没来，先出个“嗯”，把空档藏住
function startFiller() {
  stopFiller();
  fillerTimer = setTimeout(() => {
    try {
      if (!window.speechSynthesis || !speakOn.checked) return;
      fillerUtt = utter('嗯，我想一下。', { rate: 1.1 });
      speechSynthesis.speak(fillerUtt);
    } catch (e) { }
  }, 600);
}
function stopFiller() {
  if (fillerTimer) { clearTimeout(fillerTimer); fillerTimer = null; }
  try { if (fillerUtt) { speechSynthesis.cancel(); fillerUtt = null; } } catch (e) { }
}

function stopSpeaking() {
  try { speechSynthesis.cancel(); } catch (e) { }
  currentReply = '';
  stopFiller();
}

function startListening() {
  if (!inCall || !recog) return;
  if (phase === 'thinking') return;
  phase = 'listening';
  pendingText = '';
  try { recog.start(); } catch (e) { }
}

function startCall() {
  if (!recog) return;
  inCall = true;
  micBtn.classList.add('on');
  micBtn.textContent = '⏹';
  setStatus('通话中：直接说话，说完我接；我说话时你可以随时打断。再点一下挂断。');
  startListening();
}

function endCall() {
  inCall = false;
  phase = 'idle';
  pendingText = '';
  if (flushTimer) { clearTimeout(flushTimer); flushTimer = null; }
  stopSpeaking();
  micBtn.classList.remove('on');
  micBtn.textContent = '🎙️';
  try { recog.stop(); } catch (e) { }
  setStatus('通话结束。点麦克风重新开始。');
}

function scheduleFlush() {
  if (flushTimer) clearTimeout(flushTimer);
  flushTimer = setTimeout(() => {
    flushTimer = null;
    const t = pendingText.trim();
    if (!t || phase !== 'listening') return;
    pendingText = '';
    input.value = t;
    form.requestSubmit();
  }, 1200);
}

function setupVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    micBtn.style.display = 'none';
    setStatus('这个浏览器不支持语音识别，打字就行。默认只听 127.0.0.1，别暴露到公网。');
    return;
  }
  recog = new SR();
  recog.lang = 'zh-CN';
  recog.interimResults = true;
  recog.continuous = true;

  recog.onresult = (ev) => {
    let add = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) add += ev.results[i][0].transcript;
    if (!add.trim()) return;

    // 她在说话时，听到什么都当成回声，除非明显不像
    if (phase === 'speaking' && looksLikeEcho(add)) return;

    // 打断：她正说着，你开口了 → 停她，听你说
    if (phase === 'speaking' || phase === 'thinking') {
      stopSpeaking();
      phase = 'listening';
      setStatus('通话中（你说话，我在听）');
    }

    pendingText += add;
    input.value = pendingText.trim();
    scheduleFlush();
  };

  recog.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    if (e.error === 'not-allowed') { endCall(); setStatus('没给麦克风权限，允许一下再试，或者直接打字。'); return; }
    setStatus('识别出问题：' + e.error + '（打字也行）');
  };

  recog.onend = () => {
    if (inCall && phase !== 'thinking' && phase !== 'speaking') setTimeout(() => { if (inCall && phase === 'listening') try { recog.start(); } catch (e) { } }, 250);
  };

  micBtn.addEventListener('click', () => { if (inCall) endCall(); else startCall(); });
}

function callOnReply(reply, ok) {
  if (!inCall) { if (ok && reply) speakReply(reply); return; }
  stopFiller();
  phase = 'speaking';
  // 说话期间保持听（为了能打断），回声由 looksLikeEcho 挡掉
  try { recog.start(); } catch (e) { }
  speakReply(reply, () => {
    if (!inCall) return;
    phase = 'listening';
    pendingText = '';
    try { recog.start(); } catch (e) { }
  });
}
setupVoice();

document.getElementById('openSettings').onclick = () => location.href = '/console.html';

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  add('你', text, 'me');
  send.disabled = true;
  if (inCall) { phase = 'thinking'; startFiller(); }
  const pending = add('她', '…');
  pending.querySelector('.body').textContent = '（在想）';
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ message: text, session })
    });
    const j = await r.json();
    pending.querySelector('.body').textContent = j.ok ? j.reply : ('出错了：' + j.error);
    if (!j.ok) pending.classList.add('err');
    if (j.ok && j.reply) callOnReply(j.reply, true);
    if (j.stats) {
      const s = document.createElement('div');
      s.className = 'stats';
      s.textContent = '@' + (j.stats.provider || '?') + ' · ' + (j.stats.ms || 0) + 'ms · '
        + (j.stats.total_tokens || 0) + ' tok · 步数 ' + (j.stats.steps || 0)
        + (j.stats.tools && j.stats.tools.length ? ' · 工具 ' + j.stats.tools.join(',') : '')
        + (j.stats.memory_used ? ' · 召回 ' + j.stats.memory_used : '');
      pending.appendChild(s);
    }
    selfcheck();
    loadCost();
    loadRoute();
  } catch (e) {
    pending.querySelector('.body').textContent = '网络/服务出错了：' + e.message;
    if (inCall) { phase = 'listening'; startListening(); }
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
